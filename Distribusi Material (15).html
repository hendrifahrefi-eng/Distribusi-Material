async function loadStore(){

 try{if(LF){await LF.ready();d=await LF.getItem(KEY)}}catch(e){console.error('localForage gagal dibaca',e)}
 if(!d||!d.pos){
  try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.pos){d=old;if(LF){try{await LF.setItem(KEY,d)}catch(e){console.error('migrasi gagal',e)}}}}catch(e){}
 }
 S=(d&&d.pos)?d:seed();
 try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
}
async function writeStore(){if(LF)await LF.setItem(KEY,S);else localStorage.setItem(KEY,JSON.stringify(S))}

 try{while(dirty){dirty=false;await writeStore()}}
 catch(e){console.error(e);toast('Gagal menyimpan data ke penyimpanan perangkat. Coba lagi atau unduh backup.')}
 finally{saving=null}
}
function persist(){dirty=true;if(!saving)saving=flushStore();return saving}
